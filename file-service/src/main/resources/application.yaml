server:
  port: 8084
  servlet:
    context-path: /files

spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: mongodb://${MONGODB_ROOT_USERNAME:root}:${MONGODB_ROOT_PASSWORD:REDACTED_LEGACY_CREDENTIAL}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/file-service?authSource=admin
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:2GB}
      max-request-size: ${MAX_REQUEST_SIZE:2100MB}
      file-size-threshold: 2KB # Chuyển sang disk nếu > 2KB

jwt:
  signerKey: ${JWT_SIGNER_KEY:uahkQQArjCd/s458SRMXBYTBbV8FiePF7TPREMKeRijTgiD6DOkEdtmxtcGPVGP0}

# Backblaze B2 - S3-compatible API
# Không đặt giá trị thật của key-id / application-key ở đây, luôn truyền qua biến môi trường.
b2:
  key-id: ${B2_KEY_ID:}
  application-key: ${B2_APPLICATION_KEY:}
  bucket-name: ${B2_BUCKET_NAME:}
  endpoint: ${B2_ENDPOINT:} # vd: s3.us-west-004.backblazeb2.com (KHÔNG kèm "https://")
  region: ${B2_REGION:} # để trống để tự suy ra từ endpoint (vd: us-west-004)
  public: ${B2_BUCKET_PUBLIC:false} # true nếu bucket ở chế độ Public, false nếu Private (sẽ trả presigned URL)
  presigned-url-ttl: ${B2_PRESIGNED_URL_TTL:PT1H} # dùng khi bucket Private

file:
  max-image-size: ${MAX_IMAGE_SIZE:25MB}
  max-video-size: ${MAX_VIDEO_SIZE:5GB}
  max-raw-size: ${MAX_RAW_SIZE:100MB}

resilience4j:
  circuitbreaker:
    instances:
      b2:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
        ignore-exceptions:
          - com.MyProject.file.file_service.exception.AppException
  ratelimiter:
    instances:
      b2:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s
      file-api:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s