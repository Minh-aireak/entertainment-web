server:
  port: 8084
  servlet:
    context-path: /file

spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/file-service?authSource=admin
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZ}
      max-request-size: ${MAX_REQUEST_SIZE}

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  file:
    storage-dir: ${FILE_STORAGE_DIR}
    download-prefix: ${FILE_DOWNLOAD_PREFIX}