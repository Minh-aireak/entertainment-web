services:
  # Databases
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: always
    ports:
      - '${MYSQL_PORT}:3306'
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
#    networks:
#      - backend

  mongodb:
    image: ${MONGODB_IMAGE}
    container_name: ${MONGODB_CONTAINER_NAME}
    restart: always
    ports:
      - '${MONGODB_PORT}:27017'
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
#    networks:
#      - backend

  neo4j:
    image: ${NEO4J_IMAGE}
    container_name: ${NEO4J_CONTAINER_NAME}
    restart: always
    ports:
      - '7474:7474'
      - '7687:7687'
    env_file:
      - .env
    environment:
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT="yes"
    volumes:
      - neo4j_data:/data
#    networks:
#      - backend

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: ${KAFKA_CONTAINER_NAME}
    restart: always
    ports:
      - "9092:9092"
      - "9094:9094"
    env_file:
      - .env
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data
#    networks:
#      - backend
    depends_on:
      - mysql
      - mongodb
      - neo4j

  # Services
  identity:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql
      - kafka

  profile:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - neo4j
      - kafka

  notification:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka

  post:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      - mysql
      - mongodb
      - kafka

  file:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    ports:
      - "8084:8084"
    env_file:
      - .env
    depends_on:
      - mongodb

  weather:
    build:
      context: .
      dockerfile: weather-service/Dockerfile
    ports:
      - "8085:8085"
    env_file:
      - .env

  chat:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "8086:8086"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka

  friend:
    build:
      context: .
      dockerfile: friend-service/Dockerfile
    ports:
      - "8087:8087"
    env_file:
      - .env
    depends_on:
      - mysql
      - kafka

  socket:
    build:
      context: .
      dockerfile: socket-service/Dockerfile
    ports:
      - "8088:8088"
    env_file:
      - .env
    depends_on:
      - mongodb
      - kafka

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8888:8888"
    depends_on:
      - identity
      - profile
      - notification
      - post
      - file
      - weather
      - chat
      - friend
      - socket

volumes:
  mysql_data:
  mongodb_data:
  neo4j_data:
  kafka_data:
