services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped
    command: 
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-time-zone=+07:00
    ports:
      - '${MYSQL_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DEBEZIUM_DB_USERNAME: ${DEBEZIUM_DB_USERNAME:?Set DEBEZIUM_DB_USERNAME in .env}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?Set DEBEZIUM_DB_PASSWORD in .env}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/db-init/mysql:/docker-entrypoint-initdb.d
    networks:
      - backend

  mongodb:
    image: ${MONGODB_IMAGE}
    container_name: ${MONGODB_CONTAINER_NAME}
    restart: unless-stopped
    # Sinh keyFile từ MONGODB_REPLICA_SET_KEY trong /etc rồi delegate sang
    # docker-entrypoint.sh chính thức (cần chạy ở entrypoint level để có quyền root
    # tạo keyFile và vẫn giữ được luồng tạo root user lần đầu của image chính thức).
    entrypoint:
      - /start-mongod.sh
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - '${MONGODB_PORT}:27017'
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/db-init/mongodb/start-mongod.sh:/start-mongod.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGODB_ROOT_USERNAME}", "--password", "${MONGODB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "try { db.adminCommand('ping').ok } catch (e) { quit(1) }"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  # Khởi tạo Replica Set + user debezium cho MongoDB (CDC)
  # Image mongo chính thức không tự khởi tạo replica set như Bitnami,
  # nên cần một service init chạy một lần sau khi mongodb healthy.
  mongo-init:
    image: ${MONGODB_IMAGE}
    container_name: mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    command:
      - mongosh
      - --host
      - mongodb:27017
      - --username
      - ${MONGODB_ROOT_USERNAME}
      - --password
      - ${MONGODB_ROOT_PASSWORD}
      - --authenticationDatabase
      - admin
      - /docker-entrypoint-initdb.d/01-init-replica-set.js
    volumes:
      - ./infrastructure/db-init/mongodb:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
      - '9094:9094'
    env_file:
      - .env
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      mysql:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    container_name: ${ELASTICSEARCH_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

  # ============================================================================
  # CDC (DEBEZIUM)
  # ============================================================================
  connect:
    image: quay.io/debezium/connect:3.0
    container_name: debezium-connect
    restart: unless-stopped
    ports:
      - '8100:8083'
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - TZ=${TZ}
    volumes:
      - connect_data:/kafka/data
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_started
    networks:
      - backend

  # ============================================================================
  # BUSINESS MICROSERVICES
  # ============================================================================
  identity:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/identity-service?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILE_SERVICE_URL=http://profile:8081/profiles
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - VALID_DURATION=${VALID_DURATION}
      - REFRESHABLE_DURATION=${REFRESHABLE_DURATION}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - GRANT_TYPE=${GRANT_TYPE}
      - DEBEZIUM_CONNECT_URL=http://connect:8083
      - TZ=${TZ}
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      connect:
        condition: service_started
      elasticsearch:
        condition: service_started
      debezium-manager:
        condition: service_healthy
    networks:
      - backend

  film:
    build:
      context: .
      dockerfile: film_service/Dockerfile
    container_name: film-service
    ports:
      - '8090:8090'
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/film-service?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - COMMENT_SERVICE_URL=http://comment:8089
      - FILE_SERVICE_URL=http://file:8084
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  profile:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    container_name: profile-service
    ports:
      - '8081:8081'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/profile-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - FILE_SERVICE_URL=http://file:8084
      - POST_SERVICE_URL=http://post:8083
      - FRIEND_SERVICE_URL=http://friend:8087
      - NOTIFICATION_SERVICE_URL=http://notification:8082
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  notification:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - '8082:8082'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/notification-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - PROFILE_SERVICE_URL=http://profile:8081/profiles
      - BREVO_URL=${BREVO_URL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - EMAIL_SENDER_NAME=${EMAIL_SENDER_NAME}
      - EMAIL_SENDER_EMAIL=${EMAIL_SENDER_EMAIL}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  chat:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    ports:
      - '8086:8086'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/chat-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILE_SERVICE_URL=http://profile:8081/profiles
      - FILE_SERVICE_URL=http://file:8084
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      identity:
        condition: service_started
    networks:
      - backend

  socket:
    build:
      context: .
      dockerfile: socket-service/Dockerfile
    container_name: socket-service
    ports:
      - '8088:8088'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/socket-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - IDENTITY_SERVICE_URL=http://identity:8080
      - CHAT_SERVICE_URL=http://chat:8086
      - PROFILE_SERVICE_URL=http://profile:8081
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      identity:
        condition: service_started
    networks:
      - backend

  post:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    container_name: post-service
    ports:
      - '8083:8083'
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/post-service?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/post-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILE_SERVICE_URL=http://profile:8081
      - FILE_SERVICE_URL=http://file:8084
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mysql:
        condition: service_started
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  file:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: file-service
    ports:
      - '8084:8084'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/file-service?authSource=admin
      - B2_KEY_ID=${B2_KEY_ID}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME}
      - B2_ENDPOINT=${B2_ENDPOINT}
      - B2_REGION=${B2_REGION}
      - B2_BUCKET_PUBLIC=${B2_BUCKET_PUBLIC}
      - B2_PRESIGNED_URL_TTL=${B2_PRESIGNED_URL_TTL}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE}
      - MAX_IMAGE_SIZE=${MAX_IMAGE_SIZE}
      - MAX_VIDEO_SIZE=${MAX_VIDEO_SIZE}
      - MAX_RAW_SIZE=${MAX_RAW_SIZE}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend



  friend:
    build:
      context: .
      dockerfile: friend-service/Dockerfile
    container_name: friend-service
    ports:
      - '8087:8087'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/friend-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILES_SERVICE_URL=http://profile:8081
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  comment:
    build:
      context: .
      dockerfile: comment-service/Dockerfile
    container_name: comment-service
    ports:
      - '8089:8089'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/comment-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - PROFILE_SERVICE_URL=http://profile:8081
      - POST_SERVICE_URL=http://post:8083
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  room:
    build:
      context: .
      dockerfile: room-service/Dockerfile
    container_name: room-service
    ports:
      - '8091:8091'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/room-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - PROFILE_SERVICE_URL=http://profile:8081
      - FILM_SERVICE_URL=http://film:8090
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  debezium-manager:
    build:
      context: .
      dockerfile: debezium-manager/Dockerfile
    container_name: debezium-manager
    ports:
      - '9000:9000'
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DEBEZIUM_CONNECT_URL=http://connect:8083
    depends_on:
      connect:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      # Healthy chỉ sau khi TẤT CẢ connector đã đăng ký xong với Kafka Connect
      # (xem DebeziumConnectorService#isReady) — service nào seed dữ liệu qua
      # outbox lúc khởi động (vd. identity-service) phải chờ tới đây mới start,
      # tránh outbox event bị rơi mất vì connector chưa tồn tại.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - '8888:8888'
    env_file:
      - .env
    environment:
      # Khi chạy trong docker, phải dùng tên service nội bộ (không phải localhost)
      - IDENTITY_SERVICE_URL=http://identity:8080
      - PROFILE_SERVICE_URL=http://profile:8081
      - NOTIFICATION_SERVICE_URL=http://notification:8082
      - CHAT_SERVICE_URL=http://chat:8086
      - SOCKET_SERVICE_URL=http://socket:8088
      - SOCKET_SERVICE_WS_URL=ws://socket:8088
      - POST_SERVICE_URL=http://post:8083
      - FILE_SERVICE_URL=http://file:8084
      - FRIEND_SERVICE_URL=http://friend:8087
      - COMMENT_SERVICE_URL=http://comment:8089
      - FILM_SERVICE_URL=http://film:8090
      - ROOM_SERVICE_URL=http://room:8091
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      identity:
        condition: service_started
      profile:
        condition: service_started
      notification:
        condition: service_started
      chat:
        condition: service_started
      socket:
        condition: service_started
    networks:
      - backend

  web-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8888/api/v1
        VITE_SOCKET_URL: ws://localhost:8888/api/v1/sockets/ws
    container_name: web-app
    ports:
      - '5173:8080'
    depends_on:
      - gateway

volumes:
  mysql_data:
  mongodb_data:
  kafka_data:
  connect_data:
  redis_data:
  elasticsearch_data:

networks:
  backend:
    driver: bridge
