services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped
    command: 
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-time-zone=+07:00
    ports:
      - '${MYSQL_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/db-init/mysql:/docker-entrypoint-initdb.d
    networks:
      - backend

  mongodb:
    image: ${MONGODB_IMAGE}
    container_name: ${MONGODB_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - '${MONGODB_PORT}:27017'
    env_file:
      - .env
    environment:
      MONGODB_ROOT_USER: ${MONGODB_ROOT_USERNAME}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY}
      MONGODB_ADVERTISED_HOSTNAME: mongodb
      TZ: ${TZ}
    volumes:
      - mongodb_data:/bitnami/mongodb
      - ./infrastructure/db-init/mongodb:/docker-entrypoint-initdb.d
    networks:
      - backend

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
      - '9094:9094'
    env_file:
      - .env
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      mysql:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    container_name: ${ELASTICSEARCH_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

  # ============================================================================
  # CDC (DEBEZIUM)
  # ============================================================================
  connect:
    image: quay.io/debezium/connect:2.7
    container_name: debezium-connect
    restart: unless-stopped
    ports:
      - '8100:8083'
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - TZ=${TZ}
    volumes:
      - connect_data:/kafka/data
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_started
    networks:
      - backend

  # ============================================================================
  # BUSINESS MICROSERVICES
  # ============================================================================
  identity:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/identity-service?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}/profiles
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      connect:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  film:
    build:
      context: .
      dockerfile: film_service/Dockerfile
    container_name: film-service
    ports:
      - '8090:8090'
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/film-service?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  profile:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    container_name: profile-service
    ports:
      - '8081:8081'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/profile-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  notification:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - '8082:8082'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/notification-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}/profiles
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  chat:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    ports:
      - '8086:8086'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/chat-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}/profiles
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      identity:
        condition: service_started
    networks:
      - backend

  socket:
    build:
      context: .
      dockerfile: socket-service/Dockerfile
    container_name: socket-service
    ports:
      - '8088:8088'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/socket-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      identity:
        condition: service_started
    networks:
      - backend

  post:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    container_name: post-service
    ports:
      - '8083:8083'
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/post-service?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/post-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mysql:
        condition: service_started
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  file:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: file-service
    ports:
      - '8084:8084'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/file-service?authSource=admin
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - backend



  friend:
    build:
      context: .
      dockerfile: friend-service/Dockerfile
    container_name: friend-service
    ports:
      - '8087:8087'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/friend-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_ELASTICSEARCH_URIS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - PROFILES_SERVICE_URL=${PROFILE_SERVICE_URL}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - backend

  comment:
    build:
      context: .
      dockerfile: comment-service/Dockerfile
    container_name: comment-service
    ports:
      - '8089:8089'
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/comment-service?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend

  debezium-manager:
    build:
      context: .
      dockerfile: debezium-manager/Dockerfile
    container_name: debezium-manager
    ports:
      - '9000:9000'
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DEBEZIUM_CONNECT_URL=http://connect:8083
    depends_on:
      connect:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - '8888:8888'
    env_file:
      - .env
    environment:
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL}
      - SOCKET_SERVICE_URL=${SOCKET_SERVICE_URL}
      - SOCKET_SERVICE_WS_URL=ws://socket:8088
      - POST_SERVICE_URL=${POST_SERVICE_URL}
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FRIEND_SERVICE_URL=${FRIEND_SERVICE_URL}
      - COMMENT_SERVICE_URL=${COMMENT_SERVICE_URL}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - TZ=${TZ}
    depends_on:
      identity:
        condition: service_started
      profile:
        condition: service_started
      notification:
        condition: service_started
      chat:
        condition: service_started
      socket:
        condition: service_started
    networks:
      - backend

  web-app:
    build:
      context: ./aireak-entertainment-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8888/api/v1
        VITE_SOCKET_URL: ws://localhost:8888/api/v1/sockets/ws
    container_name: web-app
    ports:
      - '5173:80'
    depends_on:
      - gateway

volumes:
  mysql_data:
  mongodb_data:
  kafka_data:
  connect_data:
  redis_data:
  elasticsearch_data:

networks:
  backend:
    driver: bridge
