server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block_api_internal_identity
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/users/internal/**
              filters:
                - SetStatus=FORBIDDEN
                - StripPrefix=2
            - id: identity_service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/identity/**
              filters:
                - StripPrefix=2
            - id: block_api_internal_profile
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/profile/internal/**
              filters:
                - SetStatus=FORBIDDEN
                - StripPrefix=2
            - id: profile_service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/profile/**
              filters:
                - StripPrefix=2
            - id: notification_service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/notification/**
              filters:
                - StripPrefix=2
            - id: post_service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/post/**
              filters:
                - StripPrefix=2
            - id: file_service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/file/**
              filters:
                - StripPrefix=2
            - id: weather_service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/weather/**
              filters:
                - StripPrefix=2
            - id: chat_service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/chat/**
              filters:
                - StripPrefix=2
            - id: friend_service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/friends/**
              filters:
                - StripPrefix=2
            - id: socket_service
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/socket/**
              filters:
                - StripPrefix=2