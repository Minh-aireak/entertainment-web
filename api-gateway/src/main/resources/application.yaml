server:
  port: 8888

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:REDACTED_LEGACY_CREDENTIAL}
  cloud:
    gateway:
      routes:
        - id: block-api-internal-identities
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/identities/users/internal/**
          filters:
            - SetStatus=FORBIDDEN
            - StripPrefix=2
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/identities/**
          filters:
            - StripPrefix=2
        - id: block-api-internal-profiles
          uri: ${PROFILE_SERVICE_URL:http://localhost:8081} 
          predicates:
            - Path=/api/v1/profiles/internal/**
          filters:
            - SetStatus=FORBIDDEN
            - StripPrefix=2
        - id: profile-service
          uri: ${PROFILE_SERVICE_URL:http://localhost:8081} 
          predicates:
            - Path=/api/v1/profiles/**
          filters:
            - StripPrefix=2
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
        - id: post-service
          uri: ${POST_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
        - id: file-service
          uri: ${FILE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/files/**
          filters:
            - StripPrefix=2

        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/chats/**
          filters:
            - StripPrefix=2
        - id: friend-service
          uri: ${FRIEND_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/friends/**
          filters:
            - StripPrefix=2
        - id: socket-service
          uri: ${SOCKET_SERVICE_WS_URL:ws://localhost:8088}
          predicates:
            - Path=/api/v1/sockets/**
          filters:
            - StripPrefix=2
        - id: comment-service
          uri: ${COMMENT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - StripPrefix=2
        - id: film-service
          uri: ${FILM_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/films/**
          filters:
            - StripPrefix=2

jwt:
  signerKey: ${JWT_SIGNER_KEY:uahkQQArjCd/s458SRMXBYTBbV8FiePF7TPREMKeRijTgiD6DOkEdtmxtcGPVGP0}

app:
  gateway:
    public-rate-limit:
      enabled: true
      rules:
        - name: auth-login
          path-pattern: /api/v1/identities/auth/login
          method: POST
          limit: 5
          window-seconds: 60
        - name: auth-refresh-token
          path-pattern: /api/v1/identities/auth/refresh-token
          method: POST
          limit: 15
          window-seconds: 60
        - name: auth-logout
          path-pattern: /api/v1/identities/auth/logout
          method: POST
          limit: 30
          window-seconds: 60
        - name: auth-google
          path-pattern: /api/v1/identities/auth/outbound/google
          limit: 10
          window-seconds: 60
        - name: user-registration
          path-pattern: /api/v1/identities/users/registration
          method: POST
          limit: 3
          window-seconds: 300
        - name: forgot-password
          path-pattern: /api/v1/identities/users/forgot-password
          method: POST
          limit: 3
          window-seconds: 300
        - name: reset-password
          path-pattern: /api/v1/identities/users/reset-password
          method: POST
          limit: 5
          window-seconds: 300
        - name: public-film-read
          path-pattern: /api/v1/films/**
          method: GET
          limit: 120
          window-seconds: 60
        - name: public-media-download
          path-pattern: /api/v1/files/media/download/**
          method: GET
          limit: 60
          window-seconds: 60
        - name: public-socket-handshake
          path-pattern: /api/v1/sockets/**
          method: GET
          limit: 30
          window-seconds: 60
        - name: profile-write
          path-pattern: /api/v1/profiles/my-profile/**
          method: PUT
          limit: 15
          window-seconds: 3
        - name: profile-read
          path-pattern: /api/v1/profiles/**
          method: GET
          limit: 50
          window-seconds: 5
        - name: profile-search
          path-pattern: /api/v1/profiles/search/**
          method: POST
          limit: 8
          window-seconds: 10
        - name: profile-summary
          path-pattern: /api/v1/profiles/my-summary
          method: GET
          limit: 30
          window-seconds: 10
