spring:
  datasource:
    url: jdbc:h2:mem:film-service;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
      password: test-only
  elasticsearch:
    uris: http://localhost:9200
    username: test-only
    password: test-only
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  task:
    scheduling:
      enabled: false
  main:
    lazy-initialization: true

app:
  services:
    comment:
      url: http://localhost:0
    file:
      url: http://localhost:0

jwt:
  signerKey: test-only-signer-key-not-for-production-use-0000

logging:
  level:
    org.springframework: WARN
    com.MyProject: WARN
