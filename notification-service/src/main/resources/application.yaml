server:
  port: 8082
  servlet:
    context-path: /notifications

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/notification-service?authSource=admin
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 5000
      timeout: 5000
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
        delivery.timeout.ms: 120000
        linger.ms: 1
        request.timeout.ms: 30000
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2.0

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL}
  rate-limit:
    get-my-notifications:
      limit-for-period: 50
      limit-refresh-period: 5s
    get-unread-count:
      limit-for-period: 20
      limit-refresh-period: 10s
    mark-all-as-read:
      limit-for-period: 10
      limit-refresh-period: 30s

notification:
  email:
    brevo-url: ${BREVO_URL}
    brevo-apikey: ${BREVO_API_KEY}
    sender-name: ${EMAIL_SENDER_NAME}
    sender-email: ${EMAIL_SENDER_EMAIL}

resilience4j:
  circuitbreaker:
    instances:
      notificationProfileService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      brevoEmailService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      notificationProfileService:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 0s
      brevoEmailService:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s
  retry:
    instances:
      notificationProfileService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      brevoEmailService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

jwt:
  signerKey: ${JWT_SIGNER_KEY}