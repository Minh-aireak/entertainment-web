server:
  port: 0  # Dùng cổng ngẫu nhiên

spring:
  application:
    name: notification-service-test

  # QUAN TRỌNG: Loại bỏ tự động cấu hình kết nối DB và Kafka để tránh lỗi Connection Refused
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Cấu hình giả cho Kafka (phòng trường hợp bean vẫn được tạo)
  kafka:
    bootstrap-servers: localhost:9092 # Server ảo, không cần chạy thật
    listener:
      auto-startup: false # QUAN TRỌNG: Ngăn Consumer (@KafkaListener) tự chạy khi khởi động app
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

app:
  services:
    profile:
      url: http://localhost:8081/profile

notification:
  email:
    brevo-url: https://api.brevo.com/v3/test
    brevo-apikey: fake-api-key

