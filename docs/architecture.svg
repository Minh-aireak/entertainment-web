<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ kiến trúc hệ thống AiREAK</title>
  <desc id="desc">Kiến trúc React SPA, API Gateway, các Spring Boot microservice, Kafka, Debezium, các cơ sở dữ liệu và dịch vụ bên ngoài.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b09"/>
      <stop offset="0.55" stop-color="#0a100d"/>
      <stop offset="1" stop-color="#07120c"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123823"/>
      <stop offset="1" stop-color="#0f2018"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00c86b" flood-opacity="0.28"/>
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00c86b"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35d0d6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f6b84a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>

    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #f4f7f5; font-size: 48px; font-weight: 800; letter-spacing: -1px; }
      .subtitle { fill: #98a79e; font-size: 21px; font-weight: 500; }
      .section-title { fill: #d8e2dc; font-size: 17px; font-weight: 800; letter-spacing: 2.4px; }
      .column-title { fill: #87968d; font-size: 16px; font-weight: 800; letter-spacing: 1.5px; }
      .box-title { fill: #f5f8f6; font-size: 24px; font-weight: 750; }
      .box-subtitle { fill: #a4b0a9; font-size: 16px; font-weight: 500; }
      .small { fill: #9caaa2; font-size: 15px; font-weight: 500; }
      .tiny { fill: #819087; font-size: 14px; font-weight: 600; }
      .flow-label { fill: #c8d2cc; font-size: 15px; font-weight: 700; }
      .panel { fill: #0d1310; stroke: #243029; stroke-width: 2; }
      .card { fill: #151c18; stroke: #2c3a32; stroke-width: 1.5; }
      .card-green { fill: #13241a; stroke: #1e6c42; stroke-width: 1.8; }
      .card-cyan { fill: #102124; stroke: #24666a; stroke-width: 1.8; }
      .card-amber { fill: #261f13; stroke: #725521; stroke-width: 1.8; }
      .card-purple { fill: #1c1827; stroke: #554475; stroke-width: 1.8; }
      .line-green { fill: none; stroke: #00c86b; stroke-width: 4; marker-end: url(#arrowGreen); }
      .line-cyan { fill: none; stroke: #35d0d6; stroke-width: 4; stroke-dasharray: 11 9; marker-end: url(#arrowCyan); }
      .line-amber { fill: none; stroke: #f6b84a; stroke-width: 4; marker-end: url(#arrowAmber); }
      .line-purple { fill: none; stroke: #a78bfa; stroke-width: 3; stroke-dasharray: 5 8; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="2000" height="1400" fill="url(#background)"/>
  <circle cx="1860" cy="100" r="260" fill="#00c86b" opacity="0.025"/>
  <circle cx="120" cy="1370" r="330" fill="#35d0d6" opacity="0.02"/>

  <!-- Header -->
  <g>
    <rect x="70" y="63" width="56" height="56" rx="15" fill="#00bd61" filter="url(#greenGlow)"/>
    <path d="M88 82h22l-3 24H91z M91 78l5 8 M100 78l5 8 M109 78l5 8" fill="none" stroke="#07110b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="148" y="94" class="title">AiREAK — Kiến trúc hệ thống</text>
    <text x="150" y="128" class="subtitle">Microservices · Event-driven · Realtime · Cloud storage</text>
    <rect x="1642" y="70" width="288" height="48" rx="24" fill="#10241a" stroke="#1f6841"/>
    <circle cx="1672" cy="94" r="7" fill="#00c86b"/>
    <text x="1690" y="101" fill="#bce9ce" font-size="17" font-weight="700">Spring Boot ecosystem</text>
  </g>

  <!-- Entry flow lines -->
  <path d="M490 228 H690" class="line-green"/>
  <path d="M490 290 H690" class="line-cyan"/>
  <rect x="535" y="203" width="108" height="31" rx="15" fill="#10241a" stroke="#1e6c42"/>
  <text x="589" y="224" text-anchor="middle" class="flow-label" fill="#91e7b8">HTTPS / REST</text>
  <rect x="526" y="267" width="126" height="31" rx="15" fill="#102124" stroke="#24666a"/>
  <text x="589" y="288" text-anchor="middle" class="flow-label" fill="#99e6e9">WebSocket</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="90" y="178" width="400" height="154" rx="24" class="card"/>
    <rect x="118" y="211" width="70" height="70" rx="18" fill="#102d1d" stroke="#1f7044"/>
    <rect x="134" y="228" width="38" height="25" rx="3" fill="none" stroke="#00c86b" stroke-width="4"/>
    <path d="M128 263h50" stroke="#00c86b" stroke-width="4" stroke-linecap="round"/>
    <text x="214" y="233" class="box-title">Web Client</text>
    <text x="214" y="260" class="box-subtitle">React 19 · TypeScript · Vite</text>
    <text x="214" y="286" class="small">SPA cho social, film và admin</text>
  </g>

  <!-- Gateway -->
  <g filter="url(#shadow)">
    <rect x="690" y="168" width="620" height="174" rx="26" fill="url(#gateway)" stroke="#23784a" stroke-width="2"/>
    <rect x="722" y="208" width="72" height="72" rx="20" fill="#00bd61"/>
    <path d="M744 244h29 M762 229l15 15-15 15" fill="none" stroke="#07110b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="824" y="224" class="section-title" fill="#77dca3">EDGE LAYER</text>
    <text x="824" y="259" class="box-title">Spring Cloud API Gateway</text>
    <text x="824" y="289" class="box-subtitle">JWT validation · Routing · CORS · Rate limiting</text>
    <rect x="1117" y="207" width="154" height="35" rx="17" fill="#0b1711" stroke="#2b8050"/>
    <text x="1194" y="230" text-anchor="middle" fill="#a7eec5" font-size="15" font-weight="750">Single entry point</text>
  </g>

  <!-- Gateway to services -->
  <path d="M900 342 V412" class="line-green"/>
  <text x="844" y="388" class="flow-label">HTTP / Feign</text>
  <path d="M1110 342 V378 H1260 V412" class="line-cyan"/>
  <text x="1152" y="367" class="flow-label" fill="#8ddfe3">Realtime</text>

  <!-- Microservices container -->
  <rect x="70" y="420" width="1430" height="540" rx="28" class="panel"/>
  <rect x="95" y="445" width="268" height="38" rx="19" fill="#13241a" stroke="#1e6c42"/>
  <circle cx="120" cy="464" r="6" fill="#00c86b"/>
  <text x="138" y="470" class="section-title" fill="#92e6b8">SPRING BOOT MICROSERVICES</text>
  <rect x="1190" y="446" width="274" height="36" rx="18" fill="#102124" stroke="#24666a"/>
  <text x="1327" y="469" text-anchor="middle" fill="#98e5e8" font-size="15" font-weight="750">WS: socket-service + room-service</text>

  <!-- Column headings -->
  <text x="112" y="518" class="column-title">IDENTITY &amp; PEOPLE</text>
  <text x="457" y="518" class="column-title">SOCIAL</text>
  <text x="802" y="518" class="column-title">ENTERTAINMENT</text>
  <text x="1147" y="518" class="column-title">REALTIME &amp; PLATFORM</text>

  <!-- Column 1 -->
  <g>
    <rect x="100" y="540" width="325" height="102" rx="18" class="card-green"/>
    <circle cx="130" cy="570" r="11" fill="#00c86b" opacity="0.9"/>
    <text x="153" y="577" class="box-title">identity-service</text>
    <text x="124" y="611" class="box-subtitle">Auth · JWT · Google OAuth2</text>

    <rect x="100" y="662" width="325" height="102" rx="18" class="card"/>
    <circle cx="130" cy="692" r="11" fill="#789388"/>
    <text x="153" y="699" class="box-title">profile-service</text>
    <text x="124" y="733" class="box-subtitle">Hồ sơ và thông tin người dùng</text>

    <rect x="100" y="784" width="325" height="102" rx="18" class="card"/>
    <circle cx="130" cy="814" r="11" fill="#789388"/>
    <text x="153" y="821" class="box-title">friend-service</text>
    <text x="124" y="855" class="box-subtitle">Kết bạn · tìm kiếm người dùng</text>
  </g>

  <!-- Column 2 -->
  <g>
    <rect x="445" y="540" width="325" height="102" rx="18" class="card"/>
    <circle cx="475" cy="570" r="11" fill="#789388"/>
    <text x="498" y="577" class="box-title">post-service</text>
    <text x="469" y="611" class="box-subtitle">Bài đăng · feed mạng xã hội</text>

    <rect x="445" y="662" width="325" height="102" rx="18" class="card"/>
    <circle cx="475" cy="692" r="11" fill="#789388"/>
    <text x="498" y="699" class="box-title">comment-service</text>
    <text x="469" y="733" class="box-subtitle">Bình luận · tương tác</text>

    <rect x="445" y="784" width="325" height="102" rx="18" class="card-cyan"/>
    <circle cx="475" cy="814" r="11" fill="#35d0d6"/>
    <text x="498" y="821" class="box-title">chat-service</text>
    <text x="469" y="855" class="box-subtitle">Tin nhắn và tệp đính kèm</text>
  </g>

  <!-- Column 3 -->
  <g>
    <rect x="790" y="540" width="325" height="102" rx="18" class="card"/>
    <circle cx="820" cy="570" r="11" fill="#789388"/>
    <text x="843" y="577" class="box-title">film-service</text>
    <text x="814" y="611" class="box-subtitle">Catalog · tập phim · streaming HLS</text>

    <rect x="790" y="662" width="325" height="102" rx="18" class="card-cyan"/>
    <circle cx="820" cy="692" r="11" fill="#35d0d6"/>
    <text x="843" y="699" class="box-title">room-service</text>
    <text x="814" y="733" class="box-subtitle">Watch Together · đồng bộ phát</text>

    <rect x="790" y="784" width="325" height="102" rx="18" class="card-purple"/>
    <circle cx="820" cy="814" r="11" fill="#a78bfa"/>
    <text x="843" y="821" class="box-title">file-service</text>
    <text x="814" y="855" class="box-subtitle">Presigned upload · metadata</text>
  </g>

  <!-- Column 4 -->
  <g>
    <rect x="1135" y="540" width="325" height="102" rx="18" class="card-cyan"/>
    <circle cx="1165" cy="570" r="11" fill="#35d0d6"/>
    <text x="1188" y="577" class="box-title">socket-service</text>
    <text x="1159" y="611" class="box-subtitle">WebSocket cho chat · thông báo</text>

    <rect x="1135" y="662" width="325" height="102" rx="18" class="card-purple"/>
    <circle cx="1165" cy="692" r="11" fill="#a78bfa"/>
    <text x="1188" y="699" class="box-title">notification-service</text>
    <text x="1159" y="733" class="box-subtitle">Thông báo realtime · email</text>

    <rect x="1135" y="784" width="325" height="102" rx="18" class="card-amber"/>
    <circle cx="1165" cy="814" r="11" fill="#f6b84a"/>
    <text x="1188" y="821" class="box-title">debezium-manager</text>
    <text x="1159" y="855" class="box-subtitle">Đăng ký và quản lý connector</text>
  </g>

  <!-- External integrations -->
  <rect x="1535" y="420" width="395" height="540" rx="28" class="panel"/>
  <text x="1570" y="469" class="section-title">DỊCH VỤ BÊN NGOÀI</text>

  <g>
    <rect x="1570" y="520" width="325" height="106" rx="19" class="card-purple"/>
    <circle cx="1612" cy="556" r="21" fill="#f5f7f6"/>
    <text x="1612" y="563" text-anchor="middle" fill="#4285f4" font-size="21" font-weight="850">G</text>
    <text x="1647" y="556" class="box-title">Google OAuth2</text>
    <text x="1647" y="586" class="box-subtitle">→ identity-service</text>

    <rect x="1570" y="650" width="325" height="106" rx="19" class="card-purple"/>
    <circle cx="1612" cy="686" r="21" fill="#6c4bf4"/>
    <path d="M1600 686h24 M1612 674v24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="1647" y="686" class="box-title">Backblaze B2</text>
    <text x="1647" y="716" class="box-subtitle">→ file-service · video / file</text>

    <rect x="1570" y="780" width="325" height="106" rx="19" class="card-purple"/>
    <circle cx="1612" cy="816" r="21" fill="#00a884"/>
    <path d="M1599 808h26v18h-26z M1599 808l13 10 13-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <text x="1647" y="816" class="box-title">Brevo Email</text>
    <text x="1647" y="846" class="box-subtitle">→ notification-service</text>
  </g>

  <!-- Service-to-platform flows, rendered behind platform cards -->
  <path d="M650 960 V1030" class="line-green"/>
  <rect x="574" y="978" width="152" height="31" rx="15" fill="#10241a" stroke="#1e6c42"/>
  <text x="650" y="999" text-anchor="middle" class="flow-label">Read / Write</text>

  <path d="M1328 960 V1105" fill="none" stroke="#f6b84a" stroke-width="4" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
  <rect x="1248" y="991" width="160" height="31" rx="15" fill="#261f13" stroke="#725521"/>
  <text x="1328" y="1012" text-anchor="middle" class="flow-label" fill="#f9d696">Domain events</text>

  <path d="M1436 886 V995 H1485 V1210" class="line-purple"/>
  <text x="1450" y="976" class="flow-label" fill="#cdbdf8">configure</text>

  <!-- Data platform -->
  <rect x="70" y="1030" width="1020" height="310" rx="28" class="panel"/>
  <text x="100" y="1075" class="section-title">DATA PLATFORM</text>

  <g>
    <rect x="95" y="1105" width="230" height="190" rx="20" class="card-green"/>
    <ellipse cx="137" cy="1143" rx="21" ry="9" fill="none" stroke="#00c86b" stroke-width="3"/>
    <path d="M116 1143v25c0 5 9 9 21 9s21-4 21-9v-25 M116 1155c0 5 9 9 21 9s21-4 21-9" fill="none" stroke="#00c86b" stroke-width="3"/>
    <text x="173" y="1151" class="box-title">MySQL</text>
    <text x="118" y="1203" class="small">identity · post · film</text>
    <text x="118" y="1232" class="tiny">Dữ liệu quan hệ</text>

    <rect x="340" y="1105" width="230" height="190" rx="20" class="card-green"/>
    <ellipse cx="382" cy="1143" rx="21" ry="9" fill="none" stroke="#00c86b" stroke-width="3"/>
    <path d="M361 1143v25c0 5 9 9 21 9s21-4 21-9v-25 M361 1155c0 5 9 9 21 9s21-4 21-9" fill="none" stroke="#00c86b" stroke-width="3"/>
    <text x="418" y="1151" class="box-title">MongoDB</text>
    <text x="363" y="1199" class="small">profile · post · comment</text>
    <text x="363" y="1227" class="small">friend · chat · socket</text>
    <text x="363" y="1255" class="tiny">notification · file · room</text>

    <rect x="585" y="1105" width="230" height="190" rx="20" class="card-green"/>
    <rect x="611" y="1124" width="43" height="39" rx="9" fill="none" stroke="#00c86b" stroke-width="3"/>
    <path d="M619 1136h27 M619 1146h27 M619 1156h27" stroke="#00c86b" stroke-width="3" stroke-linecap="round"/>
    <text x="673" y="1151" class="box-title">Redis</text>
    <text x="608" y="1203" class="small">Shared cache</text>
    <text x="608" y="1232" class="tiny">Gateway rate limiting</text>

    <rect x="830" y="1105" width="235" height="190" rx="20" class="card-green"/>
    <circle cx="872" cy="1143" r="20" fill="none" stroke="#00c86b" stroke-width="3"/>
    <path d="M886 1157l14 14" stroke="#00c86b" stroke-width="4" stroke-linecap="round"/>
    <text x="907" y="1151" class="box-title">Elasticsearch</text>
    <text x="853" y="1203" class="small">film · friend</text>
    <text x="853" y="1232" class="tiny">Search indexes</text>
  </g>

  <!-- Event backbone -->
  <rect x="1125" y="1030" width="405" height="310" rx="28" class="panel"/>
  <text x="1155" y="1075" class="section-title">EVENT BACKBONE &amp; CDC</text>

  <rect x="1155" y="1105" width="345" height="90" rx="19" class="card-amber"/>
  <circle cx="1194" cy="1150" r="20" fill="#f6b84a" opacity="0.18" stroke="#f6b84a"/>
  <circle cx="1187" cy="1150" r="4" fill="#f6b84a"/>
  <circle cx="1201" cy="1140" r="4" fill="#f6b84a"/>
  <circle cx="1201" cy="1160" r="4" fill="#f6b84a"/>
  <path d="M1190 1148l8-6 M1190 1152l8 6" stroke="#f6b84a" stroke-width="3"/>
  <text x="1230" y="1149" class="box-title">Apache Kafka</text>
  <text x="1230" y="1176" class="box-subtitle">KRaft · publish / consume</text>

  <rect x="1155" y="1210" width="345" height="90" rx="19" class="card-amber"/>
  <circle cx="1194" cy="1255" r="20" fill="#f6b84a" opacity="0.18" stroke="#f6b84a"/>
  <path d="M1184 1255h20 M1198 1249l6 6-6 6" fill="none" stroke="#f6b84a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1230" y="1254" class="box-title">Debezium Connect</text>
  <text x="1230" y="1281" class="box-subtitle">MySQL + MongoDB CDC / Outbox</text>

  <path d="M1090 1255 H1155" class="line-amber"/>
  <path d="M1498 1210 C1515 1200 1515 1195 1498 1187" class="line-amber"/>

  <!-- Legend -->
  <rect x="1565" y="1030" width="365" height="310" rx="28" class="panel"/>
  <text x="1595" y="1075" class="section-title">CHÚ GIẢI LUỒNG</text>

  <path d="M1602 1120h70" stroke="#00c86b" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="1695" y="1127" class="box-subtitle">HTTP / dữ liệu</text>

  <path d="M1602 1175h70" stroke="#35d0d6" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#arrowCyan)"/>
  <text x="1695" y="1182" class="box-subtitle">WebSocket realtime</text>

  <path d="M1602 1230h70" stroke="#f6b84a" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text x="1695" y="1237" class="box-subtitle">Kafka / CDC</text>

  <path d="M1602 1285h70" stroke="#a78bfa" stroke-width="3" stroke-dasharray="5 8" marker-end="url(#arrowPurple)"/>
  <text x="1695" y="1292" class="box-subtitle">Tích hợp / quản lý</text>

  <text x="70" y="1372" class="tiny">AiREAK Entertainment Platform · React SPA + Spring Boot microservices</text>
  <text x="1930" y="1372" text-anchor="end" class="tiny">REST · WebSocket · Kafka · Debezium CDC</text>
</svg>
