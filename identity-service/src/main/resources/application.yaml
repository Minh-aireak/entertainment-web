server:
  port: 8080
  servlet:
    context-path: /identities

spring:
  datasource:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/identity-service?createDatabaseIfNotExist=true
      username: ${MYSQL_ROOT_USERNAME:root}
      password: ${MYSQL_ROOT_PASSWORD:REDACTED_LEGACY_CREDENTIAL}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
        delivery.timeout.ms: 120000
        linger.ms: 1
        request.timeout.ms: 30000
    consumer:
      group-id: identity-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "*"

jwt:
  signerKey: ${JWT_SIGNER_KEY:uahkQQArjCd/s458SRMXBYTBbV8FiePF7TPREMKeRijTgiD6DOkEdtmxtcGPVGP0}
  valid-duration: ${VALID_DURATION:3600}
  refreshable-duration: ${REFRESHABLE_DURATION:360000}
  client-id: ${CLIENT_ID:266132262326-islopun9fjajf96gds894ncmi43ugcku.apps.googleusercontent.com}
  client-secret: ${CLIENT_SECRET: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}
  redirect-uri: ${REDIRECT_URI:http://localhost:5173/authenticate}
  grant-type: ${GRANT_TYPE:authorization_code}

app:
  services:
    debezium:
      connect-url: ${DEBEZIUM_CONNECT_URL:http://localhost:8100}

