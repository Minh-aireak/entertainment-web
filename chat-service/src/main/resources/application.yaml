server:
  port: 8086
  servlet:
    context-path: /chats

spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/chat-service?authSource=admin
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 5000
      timeout: 5000
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
        delivery.timeout.ms: 120000
        linger.ms: 1
        request.timeout.ms: 30000
    consumer:
      group-id: chat-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2.0

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL}
    file:
      url: ${FILE_SERVICE_URL}
  rate-limit:
    message-write:
      limit-for-period: 15
      limit-refresh-period: 3s
    message-update:
      limit-for-period: 10
      limit-refresh-period: 30s
    message-delete:
      limit-for-period: 10
      limit-refresh-period: 30s
    message-read:
      limit-for-period: 50
      limit-refresh-period: 5s
    message-search:
      limit-for-period: 8
      limit-refresh-period: 10s
    seen:
      limit-for-period: 12
      limit-refresh-period: 10s
    unread-count:
      limit-for-period: 20
      limit-refresh-period: 10s
    conversation-write:
      limit-for-period: 5
      limit-refresh-period: 1m
    conversation-read:
      limit-for-period: 30
      limit-refresh-period: 10s
    conversation-search:
      limit-for-period: 8
      limit-refresh-period: 10s

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        ignore-exceptions:
          - com.MyProject.chat_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      downstream:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 2s
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        ignore-exceptions:
          - com.MyProject.chat_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
    instances:
      chatSearchApi:
        base-config: default
        wait-duration-in-open-state: 20s
      conversationSearchApi:
        base-config: default
        wait-duration-in-open-state: 20s
      profileService:
        base-config: downstream
  ratelimiter:
    configs:
      default:
        timeout-duration: 0s
    instances:
      profileService:
        base-config: default
        limit-for-period: 60
        limit-refresh-period: 1s
  retry:
    configs:
      downstream:
        max-attempts: 2
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.MyProject.chat_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      profileService:
        base-config: downstream

management:
  health:
    circuitbreakers:
      enabled: true