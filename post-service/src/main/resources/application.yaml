server:
  port: 8083
  tomcat:
    redirect-context-root: false
  servlet:
    context-path: /posts

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  application:
    name: post-service
  data:
    mongodb:
      uri: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/post-service?authSource=admin
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 5000
      timeout: 5000
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: post-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "*"
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/quartz_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_ROOT_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always # always for dev never for production
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MyScheduler
            instanceId: AUTO
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: false
            clusterCheckinInterval: 20000
            useProperties: false
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL}/profiles
  rate-limit:
    post-write:
      limit-for-period: 15
      limit-refresh-period: 3s
    post-update:
      limit-for-period: 10
      limit-refresh-period: 30s
    post-delete:
      limit-for-period: 10
      limit-refresh-period: 30s
    post-read:
      limit-for-period: 50
      limit-refresh-period: 5s
    post-search:
      limit-for-period: 8
      limit-refresh-period: 10s
    post-count:
      limit-for-period: 30
      limit-refresh-period: 10s
    post-random:
      limit-for-period: 20
      limit-refresh-period: 10s

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        ignore-exceptions:
          - com.MyProject.post.post_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      downstream:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 2s
        automatic-transition-from-open-to-half-open-enabled: true
        writable-stack-trace-enabled: false
        ignore-exceptions:
          - com.MyProject.post.post_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
    instances:
      postSearchApi:
        base-config: default
        wait-duration-in-open-state: 20s
      profileService:
        base-config: downstream
  ratelimiter:
    configs:
      default:
        timeout-duration: 0s
    instances:
      profileService:
        base-config: default
        limit-for-period: 60
        limit-refresh-period: 1s
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.MyProject.post.post_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      downstream:
        max-attempts: 2
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.MyProject.post.post_service.exception.AppException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      profileService:
        base-config: downstream

management:
  health:
    circuitbreakers:
      enabled: true